name: Update Portal Index

on:
  workflow_dispatch:
  
  schedule:
    - cron: "0 0 * * *"  # 1日毎

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Pushの権限を明示

    steps:
      - uses: actions/checkout@v4

      - name: Generate index
        env:
          ORG_TOKEN: ${{ secrets.ORG_TOKEN }}  # 追加
        run: python generate_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Auto update portal index" || exit 0
          git push
