name: Update Portal Index

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # １時間ごと

  jobs:
    update:
      runs-on: ubunth-latest

      steps:
        - name: Checkout portal repo
          uses: actions/checkout@v4
          
        - name: Fetch repo list and generate index.html
          run: |
            python generate_index.py

        - name: Commit and push
          run: |
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add index.html
            git commit -m "Auo update portal index" || exit 0
            git push